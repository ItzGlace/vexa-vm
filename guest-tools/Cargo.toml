[workspace]
members = ["crates/protocol", "crates/agent"]
resolver = "2"

[workspace.package]
version = "1.7.0"
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ItzGlace/vexa-vm"

[workspace.dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.86"
base64 = "0.22.1"
hmac = "0.12.1"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
sha2 = "0.10.8"
subtle = "2.5.0"
thiserror = "1.0.61"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "json"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
